name: Chirogra
options:
  bundleIdPrefix: com.chirogra
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "14"
packages:
  ChirograKit:
    path: Packages/ChirograKit
targets:
  Chirogra:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: [Chirogra.storekit]
      # Pruebas de compras de StoreKit desde Xcode (no va dentro de la app).
      - path: App/Chirogra.storekit
        buildPhase: none
    dependencies:
      - package: ChirograKit
        products: [ChirograUI, ChirograData, ChirograCore]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chirogra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Solo HTTPS y el cifrado del sistema: no hace falta la declaración de exportación en cada subida.
        ITSAppUsesNonExemptEncryption: false
        # Avisos silenciosos de CloudKit para sincronizar al momento (iOS).
        UIBackgroundModes: [remote-notification]
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: Chirogra usa Face ID para proteger tus libros.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        # Copia de seguridad (`BackupArchive`, `UTType.chirograBackup`).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.chirogra.backup
            UTTypeDescription: Copia de Chirogra
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chirogra]
    # iCloud (CloudKit, contenedor iCloud.com.chirogra.app) y avisos de CloudKit. El Mac usa otro archivo porque la
    # clave de los avisos se llama distinto (`com.apple.developer.aps-environment`).
    entitlements:
      path: App/Chirogra.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chirogra.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Chirogra-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chirogra.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # App/AppIcon.icon (Icon Composer), recurso por estar en App/
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
schemes:
  Chirogra:
    build:
      targets:
        Chirogra: all
    run:
      # Al ejecutar desde Xcode, la suscripción usa este archivo (compras de prueba, sin cobrar).
      storeKitConfiguration: App/Chirogra.storekit
    test:
      gather_coverage_data: true
