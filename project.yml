name: Chirogra
options:
  bundleIdPrefix: com.chirogra
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ChirograKit:
    path: Packages/ChirograKit
targets:
  Chirogra:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: ChirograKit
        products: [ChirograUI, ChirograData, ChirograCore]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chirogra
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: Chirogra usa Face ID para proteger tus libros.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        # Copia de seguridad (`BackupArchive`, `UTType.chirograBackup`).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.chirogra.backup
            UTTypeDescription: Copia de Chirogra
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chirogra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chirogra.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # App/AppIcon.icon (Icon Composer), recurso por estar en App/
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
schemes:
  Chirogra:
    build:
      targets:
        Chirogra: all
    test:
      gather_coverage_data: true
