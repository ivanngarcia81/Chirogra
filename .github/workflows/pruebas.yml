# Verificación de cada cambio (revisión externa del 21-nov): en cada push y pull request corre scripts/verificar.sh
# (pruebas del paquete, apps de iOS y Mac compiladas, número de build). El repo es público: los minutos de macOS de
# GitHub Actions no se cobran.
name: Pruebas
on:
  push:
    branches: [main, "version-*"]
    paths-ignore: ["sitio/**", "docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    # macos-26 solo trae hasta Xcode 26.6, que se cae compilando el paquete (21-nov). La imagen xcode-27 (en
    # «preview» de GitHub) trae Xcode 27; se usa el 27.0, el mismo con que se suben los builds.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Usar Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
      - name: Verificar
        run: zsh scripts/verificar.sh
  # Pruebas de interfaz (23-nov): los flujos principales en el simulador del iPhone (scripts/interfaz.sh).
  interfaz:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Usar Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcrun simctl list devices available | grep -m 3 iPhone || true
      - name: Pruebas de interfaz
        run: zsh scripts/interfaz.sh
      - name: Guardar el resultado si falla (capturas de cada fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interfaz-xcresult
          path: build/interfaz/Resultado.xcresult
          retention-days: 7
