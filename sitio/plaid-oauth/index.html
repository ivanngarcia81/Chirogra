<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Volver a Chirogra</title>
<link rel="stylesheet" href="../estilos.css">
</head>
<body>
<!-- Dirección de regreso de OAuth de Plaid (redirect_uri) para el iPhone y el
     iPad. Con la app instalada, iOS abre Chirogra en vez de esta página (enlace
     universal: ver `.well-known/apple-app-site-association`) y Plaid termina la
     conexión dentro de la app. Esta página solo se ve en un navegador sin la app. -->
<main>
  <div class="tarjeta" style="text-align:center">
    <h1>Vuelve a Chirogra</h1>
    <p>Ya terminaste en la página de tu banco. Abre la app de Chirogra para acabar de conectar la cuenta.</p>
    <p lang="en" style="color:var(--tinta2)">You're done at your bank's page. Open the Chirogra app to finish connecting the account.</p>
  </div>
</main>
</body>
</html>
